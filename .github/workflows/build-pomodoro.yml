name: Build Pomodoro APK

on:
  push:
    branches:
      - main
      - claude/commodore-timer-controls-MdOid
    paths:
      - 'Pomodoro/**'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: Pomodoro
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-wear-debug
          path: Pomodoro/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
