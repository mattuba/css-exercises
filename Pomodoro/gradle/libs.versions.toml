[versions]
agp                  = "8.5.2"
kotlin               = "1.9.25"
compose-compiler-ext = "1.5.15"
compose-bom          = "2024.06.00"
wear-compose         = "1.3.1"
lifecycle            = "2.8.4"
activity             = "1.9.1"
coroutines           = "1.8.1"
core-ktx             = "1.13.1"

[libraries]
androidx-core-ktx            = { group = "androidx.core",              name = "core-ktx",                    version.ref = "core-ktx" }
androidx-compose-bom         = { group = "androidx.compose",           name = "compose-bom",                 version.ref = "compose-bom" }
androidx-ui                  = { group = "androidx.compose.ui",        name = "ui" }
androidx-foundation          = { group = "androidx.compose.foundation", name = "foundation" }
wear-compose-material        = { group = "androidx.wear.compose",      name = "compose-material",            version.ref = "wear-compose" }
wear-compose-foundation      = { group = "androidx.wear.compose",      name = "compose-foundation",          version.ref = "wear-compose" }
lifecycle-viewmodel-compose  = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose    = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }
coroutines-android           = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
activity-compose             = { group = "androidx.activity",          name = "activity-compose",            version.ref = "activity" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
